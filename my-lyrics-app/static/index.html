<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apple Motion Lyrics</title>
<style>
  :root {
    --bg: #07080b;
    --panel: #0f1117;
    --panel-2: #161922;
    --border: #23273318;
    --border-strong: #2a2f3f;
    --text: #f5f5f7;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    --pink: #ff375f;
    --purple: #bf5af2;
    --yellow: #ffd60a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }

  .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { background: var(--panel); border-right: 1px solid var(--border-strong);
             display: flex; flex-direction: column; min-width: 0; }
  .sidebar header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border-strong); }
  .sidebar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .sidebar .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .drop { margin-top: 14px; border: 1.5px dashed #3a3f4d; border-radius: 14px;
          padding: 22px 16px; text-align: center; cursor: pointer;
          transition: background .15s, border-color .15s; background: #11131a; }
  .drop:hover { background: #151925; border-color: var(--accent); }
  .drop.drag { border-color: var(--accent); background: #111a2b; }
  .drop .icon { font-size: 28px; margin-bottom: 6px; }
  .drop .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .drop input[type=file] { display: none; }

  .model-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .model-row select, .model-row button {
    background: #1a1e2a; border: 1px solid var(--border-strong); color: var(--text);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .model-row select { flex: 1; }
  .primary { background: var(--accent) !important; border-color: transparent !important;
             color: #fff; font-weight: 600; }
  .primary[disabled] { opacity: .5; cursor: wait; }
  .ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
  .ghost:hover { background: #1a1e2a; }

  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.ok  { color: var(--green); }
  .status.err { color: var(--red); }

  .scenes-label { padding: 14px 20px 8px; font-size: 11px; font-weight: 700;
                  letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase;
                  display: flex; justify-content: space-between; align-items: center; }
  .scenes { flex: 1; overflow-y: auto; padding: 0 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .scene { background: var(--panel-2); border: 1px solid var(--border-strong);
           border-radius: 12px; padding: 10px 12px; cursor: pointer;
           display: flex; gap: 10px; align-items: flex-start; transition: .15s; }
  .scene:hover { border-color: #3b4358; }
  .scene.active { border-color: var(--accent); background: #18203a; }
  .scene .num { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 28px; }
  .scene .body { flex: 1; min-width: 0; }
  .scene .t { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scene .w { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px;
              background: #262c3b; font-size: 10px; color: #9cb4ff; }
  .scene .l { margin-top: 4px; font-size: 13px; line-height: 1.35;
              overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
              -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ---------- Preview ---------- */
  .preview { display: flex; flex-direction: column; align-items: center; justify-content: center;
             position: relative; background: radial-gradient(1200px 600px at 50% 0%, #141827 0%, var(--bg) 60%); }
  .stage-frame { position: relative; }
  .stage-shell {
    width: 360px; height: 640px; border-radius: 40px; background: #000;
    box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 2px #1c1c1e, 0 0 0 10px #000;
    overflow: hidden; position: relative;
  }
  /* 1080x1920 logical stage, scaled down to 360x640 */
  .stage {
    position: absolute; width: 1080px; height: 1920px; top: 0; left: 0;
    transform-origin: 0 0; transform: scale(calc(360 / 1080));
    overflow: hidden;
    background: #0b0c10;
  }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
           width: 220px; height: 58px; background: #000; border-radius: 32px; z-index: 20; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 74px; z-index: 15;
               display: flex; align-items: center; justify-content: space-between;
               padding: 24px 56px 0; font-weight: 600; font-size: 28px;
               color: #fff; pointer-events: none; }
  .statusbar .right { display: flex; gap: 12px; align-items: center; }
  .sb-bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; }
  .sb-bars span { width: 4px; background: #fff; border-radius: 2px; height: 20%; }
  .sb-bars span:nth-child(1){height: 35%}
  .sb-bars span:nth-child(2){height: 55%}
  .sb-bars span:nth-child(3){height: 75%}
  .sb-bars span:nth-child(4){height: 100%}
  .sb-wifi { width: 26px; height: 20px; }
  .sb-batt { width: 42px; height: 20px; border: 2px solid #fff; border-radius: 6px;
             position: relative; padding: 2px; }
  .sb-batt::after { content: ""; position: absolute; right: -6px; top: 5px;
                    width: 4px; height: 8px; background: #fff; border-radius: 2px; }
  .sb-batt > i { display: block; height: 100%; width: 85%; background: #fff; border-radius: 2px; }

  /* Background layer */
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg.rain { background: linear-gradient(180deg, #05070b 0%, #0b0f17 60%, #10141c 100%); }
  .bg.rain::before { content: ""; position: absolute; inset: 0;
                     background-image: radial-gradient(circle at 50% 12%, rgba(255,255,255,.08), transparent 40%),
                                       radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.12), transparent 60%); }
  .bg.light { background: linear-gradient(180deg, #f1f2f5 0%, #e3e5eb 100%); }
  .bg.noise { background: #0b0c10; }
  .bg.noise::after { content: ""; position: absolute; inset: 0; opacity: .05; pointer-events: none;
                     background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>"); }

  /* Vignette */
  .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none;
              background: radial-gradient(120% 80% at 50% 40%, transparent 50%, rgba(0,0,0,.55) 100%); }

  /* Moon + streetlamp + rain animation used in the 'rain' bg */
  .moon { position: absolute; top: 240px; right: 130px; width: 180px; height: 180px;
          border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0f0ef, #a9a69e 70%, #6c6a62 100%);
          box-shadow: 0 0 80px rgba(255,255,255,.2); opacity: .85; }
  .lamp { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 420px; height: 720px;
          pointer-events: none; }
  .lamp-shaft { position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
                width: 520px; height: 680px;
                background: radial-gradient(ellipse at 50% 0%, rgba(255,250,220,.35), rgba(255,250,220,0) 60%);
                filter: blur(2px); }
  .lamp-fixture { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
                  width: 120px; height: 50px; border-radius: 16px;
                  background: linear-gradient(180deg, #d0d2d6, #7b7f88); }
  .lamp-pole { position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
               width: 36px; height: 670px;
               background: linear-gradient(180deg, #32353c 0%, #15171c 100%); }
  .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #020305 80%); }

  .rain-drops { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .rain-drops i { position: absolute; top: -200px; width: 2px; height: 60px;
                  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(200,210,230,.55));
                  animation: drop linear infinite; }
  @keyframes drop {
    0%   { transform: translate3d(0,-120px,0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate3d(0, 2200px, 0); opacity: 0; }
  }

  /* Lyrics box */
  .lyrics { position: absolute; top: 180px; left: 80px; right: 80px; z-index: 10;
            font-size: 78px; font-weight: 800; line-height: 1.08; letter-spacing: -0.03em;
            text-shadow: 0 6px 30px rgba(0,0,0,.55); }
  .lyrics .row { display: block; color: rgba(255,255,255,.25); transition: color .3s ease, transform .3s ease; }
  .lyrics .row.prev { color: rgba(255,255,255,.35); }
  .lyrics .row.cur  { color: #fff; }
  .lyrics .row.cur .hl { color: var(--accent, #0a84ff); }
  .lyrics.enter .row.cur { animation: rise .4s cubic-bezier(.22,1,.36,1); }
  @keyframes rise {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* Widget container */
  .widget { position: absolute; top: 700px; left: 80px; right: 80px; min-height: 520px;
            border-radius: 60px; padding: 48px; color: #fff;
            background: rgba(28,28,30,.72);
            border: 1.5px solid rgba(255,255,255,.12);
            box-shadow: 0 40px 100px rgba(0,0,0,.55);
            -webkit-backdrop-filter: blur(50px) saturate(140%);
            backdrop-filter: blur(50px) saturate(140%);
            transform: perspective(1600px) rotateX(6deg) rotateY(-3deg);
            transition: background .4s, color .4s, border-color .4s;
            z-index: 8; }
  .widget.light { background: rgba(255,255,255,.78); color: #0b0c10;
                  border-color: rgba(0,0,0,.08); }
  .widget .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
  .widget .card { background: rgba(255,255,255,.06); border-radius: 36px; padding: 28px;
                  min-height: 200px; border: 1px solid rgba(255,255,255,.08);
                  display: flex; flex-direction: column; justify-content: space-between; }
  .widget.light .card { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.08); }

  /* Mini player (bottom) */
  .miniplayer { position: absolute; left: 40px; right: 40px; bottom: 56px; height: 140px;
                background: rgba(28,28,30,.78); border: 1px solid rgba(255,255,255,.08);
                border-radius: 40px; padding: 20px 28px; z-index: 12;
                -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
                display: flex; align-items: center; gap: 24px; color: #fff; }
  .miniplayer .art { width: 100px; height: 100px; border-radius: 22px; flex-shrink: 0;
                     background: linear-gradient(135deg, #444, #111);
                     display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .miniplayer .meta { flex: 1; min-width: 0; }
  .miniplayer .title { font-weight: 700; font-size: 26px; }
  .miniplayer .artist { font-size: 20px; color: rgba(255,255,255,.6); margin-top: 4px; }
  .miniplayer .bar { margin-top: 10px; height: 6px; background: rgba(255,255,255,.15);
                     border-radius: 3px; overflow: hidden; }
  .miniplayer .bar i { display: block; height: 100%; background: #fff; width: 0%;
                       transition: width .2s linear; }
  .miniplayer .times { margin-top: 6px; display: flex; justify-content: space-between;
                       font-size: 18px; color: rgba(255,255,255,.55);
                       font-variant-numeric: tabular-nums; }
  .miniplayer .wave { display: inline-flex; gap: 4px; align-items: flex-end; height: 40px; }
  .miniplayer .wave span { width: 6px; background: #fff; border-radius: 3px;
                           animation: wave 1s ease-in-out infinite; }
  .miniplayer .wave span:nth-child(1){height: 30%; animation-delay:-.0s}
  .miniplayer .wave span:nth-child(2){height: 70%; animation-delay:-.2s}
  .miniplayer .wave span:nth-child(3){height: 45%; animation-delay:-.4s}
  .miniplayer .wave span:nth-child(4){height: 90%; animation-delay:-.6s}
  .miniplayer .wave span:nth-child(5){height: 55%; animation-delay:-.8s}
  @keyframes wave { 0%,100%{transform: scaleY(.5)} 50%{transform: scaleY(1)} }

  /* Widget primitives */
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px;
          border-radius: 14px; background: rgba(255,255,255,.08); font-size: 20px; font-weight: 600; }
  .chip.ok  { background: rgba(48,209,88,.18); color: #30d158; }
  .chip.err { background: rgba(255,69,58,.18); color: #ff453a; }
  .chip.info{ background: rgba(10,132,255,.18); color: #64d2ff; }
  .progress { height: 18px; background: rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; margin-top: 20px; }
  .progress i { display: block; height: 100%; background: var(--accent, #0a84ff); width: 0%; transition: width .4s; }
  .wtitle { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; }
  .wsub   { font-size: 22px; color: rgba(255,255,255,.6); margin-top: 8px; }
  .widget.light .wsub { color: rgba(0,0,0,.55); }

  /* Face ID specific */
  .fid-grid { display: flex; gap: 20px; margin-top: 28px; flex-wrap: wrap; }
  .fid-tag { padding: 10px 18px; border-radius: 12px; background: rgba(10,132,255,.2);
             color: #9cb4ff; font-size: 20px; font-weight: 700; }
  .fid-scan { width: 180px; height: 180px; margin: 20px auto; position: relative; }
  .fid-scan svg { width: 100%; height: 100%; }
  .fid-scan.anim #facepath { stroke-dasharray: 600; stroke-dashoffset: 600;
      animation: scan 1.2s ease-in-out infinite alternate; }
  @keyframes scan { to { stroke-dashoffset: 0; } }

  /* Battery */
  .batt-wrap { display: flex; align-items: center; justify-content: center; margin: 40px 0; }
  .batt { width: 520px; height: 220px; border: 10px solid currentColor; border-radius: 36px;
          position: relative; padding: 18px; color: #fff; }
  .batt::after { content: ""; position: absolute; right: -24px; top: 60px; width: 18px; height: 100px;
                 background: currentColor; border-radius: 0 8px 8px 0; }
  .batt i { display: block; height: 100%; width: 0%; border-radius: 16px;
            background: currentColor; transition: width .6s ease, background .4s; }
  .batt.low    { color: #ff453a; }
  .batt.mid    { color: #ffd60a; }
  .batt.full   { color: #30d158; }
  .batt.charging { color: #30d158; }
  .batt-pct { text-align: center; font-size: 120px; font-weight: 800; letter-spacing: -0.04em; }

  /* Notes */
  .notes-body { margin-top: 26px; font-size: 36px; line-height: 1.35; font-weight: 500; }
  .notes-header { display: flex; justify-content: space-between; align-items: center;
                  color: var(--orange, #ff9f0a); font-size: 22px; font-weight: 700; }

  /* Maps */
  .map-canvas { margin-top: 20px; height: 340px; border-radius: 32px;
                background: linear-gradient(135deg, #0f1218, #1b2130);
                border: 1px solid rgba(255,255,255,.08); position: relative; overflow: hidden; }
  .map-canvas::before { content: ""; position: absolute; inset: 0;
                        background-image:
                          linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
                        background-size: 80px 80px; }
  .map-canvas .pin { position: absolute; width: 56px; height: 56px; border-radius: 50%;
                     display: flex; align-items: center; justify-content: center;
                     font-size: 26px; font-weight: 800; color: #fff;
                     box-shadow: 0 10px 20px rgba(0,0,0,.4); }
  .map-canvas .dot-me { left: 44%; top: 58%; background: #0a84ff; }
  .map-canvas .dot-you { left: 56%; top: 46%; background: #ff375f; }
  .map-canvas .compass { position: absolute; top: 18px; left: 18px; width: 64px; height: 64px;
                         border-radius: 50%; background: rgba(0,0,0,.55); display: flex; align-items: center;
                         justify-content: center; font-size: 28px; color: #fff; }
  .map-canvas .badge { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,.9);
                       color: #000; font-weight: 700; padding: 10px 18px; border-radius: 20px; font-size: 24px; }
  .map-canvas .err-bubble { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
                            background: #fff; color: #000; padding: 14px 26px; border-radius: 30px;
                            font-weight: 700; font-size: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  /* Voice (Siri) */
  .siri { display: flex; flex-direction: column; align-items: center; justify-content: center;
          margin-top: 40px; }
  .siri-orb { width: 320px; height: 320px; border-radius: 50%;
              background: radial-gradient(circle at 35% 30%, #6bd0ff, #0a84ff 55%, #004094);
              box-shadow: 0 0 80px rgba(10,132,255,.5); display: flex; align-items: center;
              justify-content: center; position: relative; animation: pulse 1.6s ease-in-out infinite; }
  .siri-orb::before { content: ""; position: absolute; inset: -20px; border-radius: 50%;
                      border: 2px solid rgba(10,132,255,.4); animation: ring 2s ease-out infinite; }
  @keyframes pulse { 0%,100%{transform: scale(1)} 50%{transform: scale(1.05)} }
  @keyframes ring  { 0%{transform: scale(.9); opacity:.8} 100%{transform: scale(1.4); opacity:0} }
  .siri .waveform { margin-top: 36px; display: flex; gap: 8px; align-items: center; height: 60px; }
  .siri .waveform span { width: 10px; background: #64d2ff; border-radius: 5px;
                         animation: wv 1s ease-in-out infinite; height: 20px; }
  .siri .waveform span:nth-child(1){animation-delay:-.0s}
  .siri .waveform span:nth-child(2){animation-delay:-.15s}
  .siri .waveform span:nth-child(3){animation-delay:-.3s}
  .siri .waveform span:nth-child(4){animation-delay:-.45s}
  .siri .waveform span:nth-child(5){animation-delay:-.6s}
  .siri .waveform span:nth-child(6){animation-delay:-.75s}
  .siri .waveform span:nth-child(7){animation-delay:-.9s}
  @keyframes wv { 0%,100%{height: 15px} 50%{height: 60px} }
  .siri .status { margin-top: 20px; font-size: 28px; color: rgba(255,255,255,.7); }

  /* Heart like */
  .heart-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 60px; }
  .heart-card { width: 300px; height: 300px; border-radius: 60px;
                background: linear-gradient(135deg, #ff375f, #c81d3d); display: flex;
                align-items: center; justify-content: center; font-size: 200px;
                box-shadow: 0 20px 60px rgba(255,55,95,.4); animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform: scale(1)} 25%{transform: scale(1.1)} 50%{transform: scale(.96)} 75%{transform: scale(1.05)} }

  /* Share location */
  .share-circles { position: relative; margin: 60px auto; width: 360px; height: 220px; }
  .share-circles .c { position: absolute; width: 140px; height: 140px; border-radius: 50%;
                      display: flex; align-items: center; justify-content: center;
                      font-size: 40px; font-weight: 800; color: #fff;
                      box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .share-circles .me  { left: 50px;  top: 30px; background: #0a84ff; }
  .share-circles .you { right: 50px; top: 30px; background: #ff375f; }
  .share-circles .pin { position: absolute; right: -10px; top: -20px; font-size: 60px; }
  .share-options { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; font-size: 28px; }
  .share-options .o { padding: 14px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .share-options .o.sel { color: #30d158; font-weight: 700; }

  /* Contacts */
  .contact-avatar { width: 240px; height: 240px; border-radius: 50%; margin: 30px auto 20px;
                    display: flex; align-items: center; justify-content: center; font-size: 120px; }
  .contact-field { margin-top: 22px; padding: 18px 4px; font-size: 34px; font-weight: 600;
                   border-bottom: 1px solid rgba(0,0,0,.1); color: #0b0c10; }
  .contact-field.ghost { color: rgba(0,0,0,.3); font-weight: 500; }
  .contact-top { display: flex; justify-content: space-between; align-items: center; color: #0a84ff;
                 font-size: 28px; font-weight: 600; }

  /* Reaction/emoji picker */
  .emoji-row { display: flex; justify-content: space-around; margin-top: 40px; }
  .emoji-smile { width: 180px; height: 180px; border-radius: 50%; border: 8px solid currentColor;
                 display: flex; align-items: center; justify-content: center; font-size: 120px;
                 color: rgba(255,255,255,.35); background: rgba(255,255,255,.05); }
  .emoji-smile.sel { color: var(--accent, #ff375f); background: rgba(255,55,95,.15);
                     transform: scale(1.1); transition: all .3s; }
  .emoji-label { margin-top: 20px; font-size: 40px; font-weight: 700; }

  /* iMessage */
  .im-header { text-align: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .im-title { font-size: 22px; font-weight: 700; }
  .im-sub { font-size: 16px; color: rgba(255,255,255,.5); margin-top: 2px; }
  .im-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 24px;
             max-height: 320px; overflow: hidden; }
  .bubble { max-width: 75%; padding: 14px 20px; border-radius: 28px; }
  .bubble.me { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 10px; }
  .bubble.them { align-self: flex-start; background: rgba(255,255,255,.15); color: #fff;
                 border-bottom-left-radius: 10px; }

  /* Weather */
  .weather-big { font-size: 180px; font-weight: 200; letter-spacing: -0.05em; text-align: center;
                 margin-top: 20px; }
  .weather-cond { text-align: center; font-size: 34px; color: rgba(255,255,255,.7); margin-top: 8px; }
  .weather-city { text-align: center; font-size: 28px; color: rgba(255,255,255,.5); margin-top: 4px; }

  /* Toggle */
  .toggle-row { display: flex; justify-content: space-between; align-items: center;
                padding: 30px 0; border-top: 1px solid rgba(255,255,255,.08); margin-top: 40px; }
  .toggle-label { font-size: 32px; font-weight: 600; }
  .toggle-sub { font-size: 20px; color: rgba(255,255,255,.55); margin-top: 6px; }
  .toggle-pill { width: 110px; height: 66px; border-radius: 36px; background: rgba(255,255,255,.2);
                 position: relative; transition: background .3s; }
  .toggle-pill.on { background: #30d158; }
  .toggle-pill i { position: absolute; top: 6px; left: 6px; width: 54px; height: 54px;
                   border-radius: 50%; background: #fff; transition: left .3s; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .toggle-pill.on i { left: 50px; }

  /* Stopwatch */
  .sw-time { text-align: center; font-size: 160px; font-weight: 200; font-variant-numeric: tabular-nums;
             letter-spacing: -0.04em; margin-top: 50px; }

  /* Photo note */
  .photo { position: relative; border-radius: 28px; overflow: hidden;
           height: 220px; background: linear-gradient(135deg, #1a202c, #3c4556);
           margin-top: 20px; display: flex; align-items: center; justify-content: center;
           padding: 24px; font-size: 38px; line-height: 1.25; color: #e8e8ea;
           font-family: "Georgia", serif; font-style: italic; }
  .photo .ps { position: absolute; left: 20px; bottom: 12px; font-size: 22px; font-style: normal; color: #bbb; }

  /* Palette/Wallet */
  .palette-row { display: flex; justify-content: space-around; margin-top: 40px; text-align: center; }
  .palette-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .palette-chip .sw { width: 90px; height: 90px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); }
  .palette-chip .n { font-size: 20px; font-weight: 600; }
  .palette-chip .h { font-size: 16px; color: rgba(255,255,255,.5); font-family: "SF Mono", ui-monospace, monospace; }

  /* Player widget */
  .pw-body { margin-top: 30px; text-align: center; }
  .pw-art { width: 280px; height: 280px; border-radius: 32px; margin: 0 auto;
            background: linear-gradient(135deg, var(--accent,#ff375f), #0b0c10); }
  .pw-title { margin-top: 28px; font-size: 38px; font-weight: 700; }
  .pw-artist { font-size: 24px; color: rgba(255,255,255,.6); margin-top: 6px; }
  .pw-wave { margin-top: 24px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 60px; }
  .pw-wave span { width: 8px; background: #fff; border-radius: 4px; animation: wv 1s ease-in-out infinite; }
  .pw-wave span:nth-child(1){height:30%;animation-delay:0s}
  .pw-wave span:nth-child(2){height:70%;animation-delay:.1s}
  .pw-wave span:nth-child(3){height:45%;animation-delay:.2s}
  .pw-wave span:nth-child(4){height:90%;animation-delay:.3s}
  .pw-wave span:nth-child(5){height:55%;animation-delay:.4s}
  .pw-wave span:nth-child(6){height:80%;animation-delay:.5s}
  .pw-wave span:nth-child(7){height:40%;animation-delay:.6s}

  /* Heart rate */
  .hr-big { text-align: center; font-size: 140px; font-weight: 700; margin-top: 30px; color: #ff373b; }
  .hr-unit { font-size: 38px; color: rgba(255,255,255,.6); margin-left: 6px; font-weight: 500; }
  .hr-ecg { height: 120px; margin-top: 20px; }
  .hr-status { text-align: center; font-size: 28px; color: rgba(255,255,255,.6); margin-top: 10px; }

  /* Controls under stage */
  .controls { margin-top: 22px; display: flex; gap: 10px; align-items: center; width: 360px; }
  .controls audio { flex: 1; }
  .controls button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-strong);
                     background: #161922; color: #fff; font-weight: 600; }
  .controls button:disabled { opacity: .5; cursor: not-allowed; }

  /* Export progress */
  .export-progress { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100;
                     display: none; align-items: center; justify-content: center; flex-direction: column;
                     gap: 16px; color: #fff; font-size: 18px; }
  .export-progress.show { display: flex; }
  .spinner { width: 44px; height: 44px; border: 4px solid #333; border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Light theme overrides for statusbar */
  .stage.light-stage .statusbar { color: #0b0c10; }
  .stage.light-stage .sb-bars span { background: #0b0c10; }
  .stage.light-stage .sb-batt { border-color: #0b0c10; }
  .stage.light-stage .sb-batt i { background: #0b0c10; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>Apple Motion Lyrics</h1>
      <div class="sub">Вертикальные 9:16 lyric-видео из MP3 за минуту</div>

      <label class="drop" id="drop">
        <div class="icon">🎵</div>
        <div id="dropText">Загрузить MP3 / перетащите файл</div>
        <div class="hint">Whisper + Arena AI · Экспорт в MP4 1080×1920</div>
        <input id="file" type="file" accept="audio/*" />
      </label>

      <div class="model-row">
        <select id="modelSel" title="Модель LLM">
          <option value="fast">⚡ Быстрая (fast)</option>
          <option value="max">🧠 Сильная (max)</option>
          <option value="claude-opus-4-6">Claude Opus 4</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4</option>
          <option value="gpt-5">GPT-5</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>
        <button id="genBtn" class="primary">Сгенерировать</button>
      </div>
      <div class="status" id="status">Готово.</div>
    </header>

    <div class="scenes-label">
      <span>Сцены</span>
      <span id="sceneCount"></span>
    </div>
    <div class="scenes" id="scenes"></div>
  </aside>

  <main class="preview">
    <div class="stage-frame">
      <div class="stage-shell">
        <div class="stage" id="stage">
          <div class="bg" id="bg"></div>
          <div class="moon" id="moon" style="display:none"></div>
          <div class="lamp" id="lamp" style="display:none">
            <div class="lamp-shaft"></div>
            <div class="lamp-pole"></div>
            <div class="lamp-fixture"></div>
          </div>
          <div class="ground" id="ground" style="display:none"></div>
          <div class="rain-drops" id="rain" style="display:none"></div>
          <div class="vignette"></div>

          <div class="statusbar">
            <div id="clock">3:14</div>
            <div class="right">
              <span class="sb-bars"><span></span><span></span><span></span><span></span></span>
              <svg class="sb-wifi" viewBox="0 0 24 18" fill="#fff"><path d="M12 17a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm0-5a5 5 0 014 2l2-2a8 8 0 00-12 0l2 2a5 5 0 014-2zm0-5a10 10 0 017.5 3.5l2-2A13 13 0 002.5 8.5l2 2A10 10 0 0112 7z"/></svg>
              <div class="sb-batt"><i></i></div>
            </div>
          </div>
          <div class="notch"></div>

          <div class="lyrics" id="lyrics">
            <span class="row cur">Загрузите трек…</span>
          </div>

          <div class="widget" id="widget"></div>

          <div class="miniplayer" id="miniplayer" style="display:none">
            <div class="art" id="mpArt">🎵</div>
            <div class="meta">
              <div class="title" id="mpTitle">—</div>
              <div class="artist" id="mpArtist">—</div>
              <div class="bar"><i id="mpBar"></i></div>
              <div class="times"><span id="mpCur">0:00</span><span id="mpRem">-0:00</span></div>
            </div>
            <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <audio id="audio" controls style="flex:1"></audio>
      <button id="playBtn" class="ghost">▶</button>
      <button id="exportBtn" class="primary" disabled>⬇ MP4</button>
    </div>
  </main>
</div>

<div class="export-progress" id="exportProgress">
  <div class="spinner"></div>
  <div id="exportStatus">Рендерим MP4…</div>
</div>

<script>
/* =====================================================================
   Apple Motion Lyrics — front-end
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const stage = $('#stage');
const bg = $('#bg');
const moon = $('#moon');
const lamp = $('#lamp');
const ground = $('#ground');
const rain = $('#rain');
const lyricsEl = $('#lyrics');
const widgetEl = $('#widget');
const miniplayer = $('#miniplayer');
const audio = $('#audio');
const scenesEl = $('#scenes');
const statusEl = $('#status');
const sceneCountEl = $('#sceneCount');
const drop = $('#drop');
const fileInput = $('#file');
const genBtn = $('#genBtn');
const modelSel = $('#modelSel');
const exportBtn = $('#exportBtn');
const exportProgress = $('#exportProgress');
const exportStatus = $('#exportStatus');

let currentScenes = [];
let activeIdx = -1;
let lastFile = null;

/* ---------- Rain drops for the 'rain' background ---------- */
(function buildRain() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('i');
    d.style.left = Math.random() * 100 + '%';
    d.style.animationDuration = (0.4 + Math.random() * 0.7) + 's';
    d.style.animationDelay = (-Math.random() * 1.5) + 's';
    d.style.opacity = 0.3 + Math.random() * 0.7;
    d.style.height = (40 + Math.random() * 80) + 'px';
    frag.appendChild(d);
  }
  rain.appendChild(frag);
})();

/* ---------- Clock (fake) ---------- */
function updateClock() { $('#clock').textContent = '3:14'; }
updateClock();

/* ---------- File upload ---------- */
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag')}));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files?.[0]; if (f) setFile(f); });
fileInput.addEventListener('change', e => { const f = e.target.files?.[0]; if (f) setFile(f); });
function setFile(f) { lastFile = f; $('#dropText').textContent = '✓ ' + f.name; genBtn.disabled = false; }

genBtn.addEventListener('click', generate);
async function generate() {
  if (!lastFile) return;
  statusEl.className = 'status'; statusEl.textContent = 'Транскрибация Whisper…';
  genBtn.disabled = true; exportBtn.disabled = true;
  const fd = new FormData();
  fd.append('file', lastFile);
  fd.append('model_name', modelSel.value);
  try {
    const res = await fetch('/api/generate', {method:'POST', body: fd});
    const data = await res.json();
    if (!res.ok) { throw new Error(data.detail || data.error || JSON.stringify(data)); }
    currentScenes = data.scenes || [];
    audio.src = data.audio_url;
    miniplayer.style.display = 'flex';
    $('#mpTitle').textContent = lastFile.name.replace(/\.[^.]+$/, '');
    $('#mpArtist').textContent = data.stub_mode ? '⚠ STUB MODE (Arena не найдена)' : 'Arena AI · ' + modelSel.value;
    renderScenesGrid();
    applyScene(0);
    statusEl.className = 'status ok';
    statusEl.textContent = `Готово: ${currentScenes.length} сцен · Whisper ${data.timings_ms?.whisper}ms · Arena ${data.timings_ms?.arena}ms`
      + (data.stub_mode ? ' · STUB' : '');
    exportBtn.disabled = currentScenes.length === 0;
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Ошибка: ' + e.message;
  } finally {
    genBtn.disabled = false;
  }
}

/* ---------- Scenes grid ---------- */
function renderScenesGrid() {
  scenesEl.innerHTML = '';
  sceneCountEl.textContent = currentScenes.length + ' сцен';
  currentScenes.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'scene'; d.dataset.idx = i;
    d.innerHTML = `
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="body">
        <div class="t">${fmt(s.start)} – ${fmt(s.end)}<span class="w">${s.widget}</span></div>
        <div class="l">${escapeHtml(s.lyric)}</div>
      </div>`;
    d.onclick = () => { audio.currentTime = s.start; audio.play(); };
    scenesEl.appendChild(d);
  });
}

function fmt(t) {
  if (t == null) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Apply a scene to the stage ---------- */
function applyScene(idx) {
  if (idx === activeIdx || idx < 0 || idx >= currentScenes.length) return;
  activeIdx = idx;
  const s = currentScenes[idx];

  // Grid highlight
  [...scenesEl.children].forEach((el, i) => el.classList.toggle('active', i === idx));
  const el = scenesEl.children[idx];
  if (el) el.scrollIntoView({block:'nearest', behavior:'smooth'});

  // Accent
  const accent = s.accent || '#0a84ff';
  stage.style.setProperty('--accent', accent);

  // Background
  const bgType = s.background?.type || 'gradient';
  const colors = s.background?.colors || ['#0b0c10','#1c1c2b'];
  bg.className = 'bg ' + (bgType === 'rain' ? 'rain' : bgType === 'light' ? 'light' : 'noise');
  if (bgType === 'gradient' || bgType === 'solid') {
    bg.style.background = `linear-gradient(180deg, ${colors[0]} 0%, ${colors[1] || colors[0]} 100%)`;
  } else { bg.style.background = ''; }
  const isRain = bgType === 'rain';
  moon.style.display = isRain ? 'block' : 'none';
  lamp.style.display = isRain ? 'block' : 'none';
  ground.style.display = isRain ? 'block' : 'none';
  rain.style.display = isRain ? 'block' : 'none';

  // Light/dark stage (for statusbar colors)
  const isLight = s.theme === 'light' || bgType === 'light';
  stage.classList.toggle('light-stage', isLight);

  // Widget
  widgetEl.className = 'widget' + (isLight ? ' light' : '');
  widgetEl.innerHTML = renderWidget(s);

  // Lyrics
  const prev = idx > 0 ? currentScenes[idx-1].lyric : null;
  const cur = s.lyric || '';
  const hl = s.highlight_word;
  let curHtml = escapeHtml(cur);
  if (hl) {
    const re = new RegExp('(' + hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    curHtml = curHtml.replace(re, '<span class="hl">$1</span>');
  }
  lyricsEl.classList.remove('enter'); void lyricsEl.offsetWidth; lyricsEl.classList.add('enter');
  lyricsEl.innerHTML = (prev ? `<span class="row prev">${escapeHtml(prev)}</span>` : '')
    + `<span class="row cur">${curHtml}</span>`;
}

/* ---------- Widget renderers ---------- */
function renderWidget(s) {
  const p = s.params || {};
  const accent = s.accent || '#0a84ff';
  switch (s.widget) {
    case 'face_id': return widgetFaceId(p);
    case 'voice': return widgetVoice(p);
    case 'heart_like': return widgetHeart(p);
    case 'battery': return widgetBattery(p);
    case 'share_location': return widgetShareLoc(p);
    case 'maps': return widgetMaps(p);
    case 'notes': return widgetNotes(p);
    case 'photo_note': return widgetPhotoNote(p);
    case 'palette': return widgetPalette(p);
    case 'stopwatch': return widgetStopwatch(p);
    case 'contacts': return widgetContacts(p);
    case 'reaction': return widgetReaction(p);
    case 'imessage': return widgetIMessage(p);
    case 'weather': return widgetWeather(p);
    case 'player': return widgetPlayer(p, accent);
    case 'toggle': return widgetToggle(p);
    case 'timer': return widgetTimer(p);
    case 'heart_rate': return widgetHeartRate(p);
    default: return widgetNotes({title:'Заметка', body: s.lyric});
  }
}

function widgetFaceId(p) {
  const state = p.target_state || 'scanning';
  const prog = Number(p.progress) ?? (state === 'success' ? 100 : 75);
  const tags = p.tags || ['взгляд','голос','руки'];
  const stateClass = state === 'success' ? 'chip ok' : state === 'error' ? 'chip err' : 'chip info';
  const stateText = state === 'success' ? 'Распознано' : state === 'error' ? 'Не удалось' : 'Сканирование…';
  const sub = p.subtitle || stateText;
  return `
    <div style="display:flex; align-items:center; gap:20px;">
      <div style="width:64px;height:64px;border-radius:20px;background:${accent};"></div>
      <div style="flex:1">
        <div class="wtitle">Face ID</div>
        <div class="wsub">${p.subtitle2 || 'Сканирование лица'}</div>
      </div>
      <div class="${stateClass}">${sub}</div>
    </div>
    <div class="fid-scan anim">
      <svg viewBox="0 0 100 100" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round">
        <path id="facepath" d="M20 35 Q20 15 50 15 Q80 15 80 35 M20 65 Q20 85 50 85 Q80 85 80 65 M35 50 Q50 65 65 50" />
      </svg>
    </div>
    <div class="progress" style="--accent:${accent}"><i style="width:${prog}%; background:${accent}"></i></div>
    <div class="fid-grid">
      ${tags.map(t => `<span class="fid-tag" style="background:${accent}30;color:${accent}">${escapeHtml(t)}</span>`).join('')}
    </div>`;
}

function widgetVoice(p) {
  const status = p.status || 'listening';
  const sub = p.subtitle || 'слушаю…';
  const title = p.title || 'Распознавание';
  return `
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div class="chip info" style="display:inline-flex;gap:10px;align-items:center;">
        <span style="width:36px;height:36px;border-radius:50%;background:#64d2ff;display:inline-block;"></span>${escapeHtml(title)}
      </div>
      <div class="wsub">${escapeHtml(sub)}</div>
    </div>
    <div class="siri">
      <div class="siri-orb"></div>
      <div class="waveform"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="status">${escapeHtml(sub)}</div>
    </div>`;
}

function widgetHeart(p) {
  const title = p.title || 'Найдено';
  const sub = p.status || 'ищу совпадения…';
  return `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="wtitle">${escapeHtml(title)}</div>
      <div class="wsub">${escapeHtml(sub)}</div>
    </div>
    <div class="heart-wrap">
      <div class="heart-card">❤️</div>
    </div>`;
}

function widgetBattery(p) {
  const pct = Math.max(0, Math.min(100, Number(p.percent) || 50));
  const mode = p.mode || (pct <= 20 ? 'low' : pct >= 95 ? 'full' : 'mid');
  const fill = mode === 'low' ? '#ff453a' : mode === 'mid' ? '#ffd60a' : '#30d158';
  return `
    <div style="text-align:center; font-size:24px; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.08em; font-weight:700;">Заряд</div>
    <div class="batt-pct" style="color:${fill}">${pct}<span style="font-size:60px;opacity:.7">%</span></div>
    <div class="batt-wrap">
      <div class="batt ${mode}"><i style="width:${pct}%"></i></div>
    </div>`;
}

function widgetShareLoc(p) {
  const opts = p.options || ["На 1 час","До конца дня","Бессрочно · навечно"];
  const sel = p.selected || opts[opts.length-1];
  return `
    <div style="display:flex; align-items:center; gap:18px;">
      <div class="chip info" style="background:#30d15830;color:#30d158;">
        <span style="width:36px;height:36px;border-radius:50%;background:#30d158;display:inline-block;"></span>
        Поделиться геопозицией
      </div>
    </div>
    <div class="share-circles">
      <div class="c me">${escapeHtml(p.me_label || 'Я')}</div>
      <div class="c you">${escapeHtml(p.you_label || 'Ты')}</div>
      <div class="pin">📍</div>
    </div>
    <div class="share-options">
      ${opts.map(o => `<div class="o ${o === sel ? 'sel' : ''}">${escapeHtml(o)}</div>`).join('')}
    </div>`;
}

function widgetMaps(p) {
  const errBubble = p.route_found === false ? `<div class="err-bubble">${escapeHtml(p.badge || 'Маршрут не найден')}</div>` : '';
  return `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="wtitle" style="font-size:36px;">${escapeHtml(p.title || 'КАРТЫ')}</div>
      ${p.distance ? `<div class="chip info">≈ ${escapeHtml(p.distance)}</div>` : ''}
    </div>
    <div class="map-canvas">
      <div class="compass">▲</div>
      <div class="pin dot-me">${escapeHtml(p.me_label || 'Я')}</div>
      <div class="pin dot-you">${escapeHtml(p.you_label || 'Ты')}</div>
      ${errBubble}
    </div>
    <div class="wsub" style="margin-top:16px;">${escapeHtml(p.subtitle || p.from_point || '')}</div>`;
}

function widgetNotes(p) {
  return `
    <div class="notes-header">
      <span>‹ Заметки</span>
      <span>Готово</span>
    </div>
    <div style="margin-top:28px;">
      <div class="wtitle" style="font-size:42px;">${escapeHtml(p.title || 'Записка')}</div>
      <div class="wsub">${escapeHtml(p.subtitle || 'суббота, 3:14')}</div>
    </div>
    <div class="notes-body">${escapeHtml(p.body || '')}</div>`;
}

function widgetPhotoNote(p) {
  return `
    <div style="font-size:22px; color:rgba(255,255,255,.7); font-weight:600;">
      <span>🖼</span> Фото · Записка
    </div>
    <div class="photo">
      ${escapeHtml(p.quote || '')}
      ${p.ps ? `<div class="ps">P.S. ${escapeHtml(p.ps)}</div>` : ''}
    </div>
    <div class="notes-body" style="font-size:26px; color:rgba(255,255,255,.75); margin-top:16px;">${escapeHtml(p.caption || '')}</div>`;
}

function widgetPalette(p) {

/* ---------- Playback sync ---------- */
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime;
  const idx = currentScenes.findIndex(s => t >= s.start && t < s.end);
  if (idx !== -1) applyScene(idx);
  // Mini player progress
  if (audio.duration) {
    $('#mpBar').style.width = (t/audio.duration*100) + '%';
    $('#mpCur').textContent = fmt(t);
    $('#mpRem').textContent = '-' + fmt(Math.max(0, audio.duration - t));
  }
});
audio.addEventListener('play', () => { $('#playBtn').textContent = '❚❚'; });
audio.addEventListener('pause', () => { $('#playBtn').textContent = '▶'; });
$('#playBtn').addEventListener('click', () => { if (audio.paused) audio.play(); else audio.pause(); });

/* ---------- MP4 export via MediaRecorder + canvas captureStream ---------- */
exportBtn.addEventListener('click', startExport);

async function startExport() {
  if (!currentScenes.length) return;
  exportBtn.disabled = true;
  exportProgress.classList.add('show');
  exportStatus.textContent = 'Подготовка рендера 1080×1920…';

  // Create an offscreen canvas at 1080x1920
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // We will play the audio silently (muted) but timed to real time and paint each frame.
  // Capture stream from canvas, combine with audio via MediaRecorder.
  const vidStream = canvas.captureStream(60);
  let audioStream = null;
  try {
    // Re-decode audio element to a MediaStream via Web Audio
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const resp = await fetch(audio.src);
    const arr = await resp.arrayBuffer();
    const buf = await ac.decodeAudioData(arr);
    const src = ac.createBufferSource(); src.buffer = buf;
    const dest = ac.createMediaStreamDestination();
    src.connect(dest); src.connect(ac.destination);
    audioStream = dest.stream;
    // Mix audio track into video stream
    if (audioStream.getAudioTracks().length) vidStream.addTrack(audioStream.getAudioTracks()[0]);
    // Start playing from 0; we will also drive the render via requestAnimationFrame
    src.start();
    window._srcNode = src; window._ac = ac;
  } catch (e) {
    console.warn('Audio export fallback (no audio track):', e);
  }

  const mimeTypes = ['video/mp4;codecs=h264,aac','video/webm;codecs=vp9,opus','video/webm'];
  let mime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const chunks = [];
  const recorder = new MediaRecorder(vidStream, mime ? {mimeType: mime, videoBitsPerSecond: 8_000_000} : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(res => recorder.onstop = res);

  // Reset stage to first scene, muted
  audio.pause(); audio.currentTime = 0; applyScene(0); activeIdx = -1;
  recorder.start();
  exportStatus.textContent = 'Рендер… 0%';
  const dur = audio.duration || (currentScenes[currentScenes.length-1]?.end ?? 0);
  const start = performance.now();
  let stopped = false;

  function paint(nowMs) {
    const t = (nowMs - start) / 1000;
    if (t >= dur) {
      if (!stopped) { stopped = true; recorder.stop(); if (window._srcNode) try{window._srcNode.stop();}catch(e){} }
      return;
    }
    const idx = currentScenes.findIndex(s => t >= s.start && t < s.end);
    if (idx !== -1 && idx !== activeIdx) applyScene(idx);
    // Sync mini player
    $('#mpBar').style.width = (t/dur*100) + '%';
    $('#mpCur').textContent = fmt(t);
    $('#mpRem').textContent = '-' + fmt(Math.max(0, dur - t));
    // Render DOM → canvas using html2canvas-free approach: we simply use drawWindow-less 2D API,
    // so we rasterize by painting key elements manually. This keeps the export fully client-side
    // without CORS issues. A full pixel-perfect DOM capture is blocked by browsers without a
    // running extension; for a production pass use server-side ffmpeg + puppeteer.
    drawSceneToCanvas(ctx, currentScenes[idx], t, dur);
    exportStatus.textContent = `Рендер… ${Math.round(t/dur*100)}%`;
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);

  await done;
  const blob = new Blob(chunks, {type: recorder.mimeType || 'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ext = (recorder.mimeType || 'webm').includes('mp4') ? 'mp4' : 'webm';
  a.href = url; a.download = `lyrics_${Date.now()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  exportProgress.classList.remove('show');
  exportBtn.disabled = false;
}

/* ---- Canvas painter (for MP4 export). Mirrors the CSS stage with 2D primitives. */
function drawSceneToCanvas(ctx, s, t, dur) {
  const W = 1080, H = 1920;
  const accent = s?.accent || '#0a84ff';
  // Background
  const bgType = s?.background?.type || 'gradient';
  const colors = s?.background?.colors || ['#0b0c10','#1c1c2b'];
  const grd = ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, colors[0]); grd.addColorStop(1, colors[1]||colors[0]);
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
  // Vignette
  const vg = ctx.createRadialGradient(W/2,H*0.45, 200, W/2,H*0.45, 1200);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  // Status bar
  ctx.fillStyle = s?.theme === 'light' ? '#0b0c10' : '#fff';
  ctx.font = '600 40px -apple-system, SF Pro Display, sans-serif';
  ctx.fillText('3:14', 84, 84);
  // Notch
  ctx.fillStyle = '#000';
  roundRect(ctx, W/2-150, 20, 300, 70, 35); ctx.fill();
  // Lyrics
  if (s) {
    ctx.fillStyle = '#fff';
    ctx.font = '800 80px -apple-system, SF Pro Display, sans-serif';
    wrapText(ctx, s.lyric, 80, 420, W-160, 96);
  }
  // Widget placeholder (glass card)
  ctx.fillStyle = s?.theme === 'light' ? 'rgba(255,255,255,.82)' : 'rgba(28,28,30,.72)';
  roundRect(ctx, 80, 1000, W-160, 600, 60); ctx.fill();
  ctx.strokeStyle = s?.theme === 'light' ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.12)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = s?.theme === 'light' ? '#0b0c10' : '#fff';
  ctx.font = '800 56px -apple-system, sans-serif';
  ctx.fillText(s?.widget?.toUpperCase?.() || 'WIDGET', 140, 1110);
  ctx.font = '500 36px -apple-system';
  ctx.fillStyle = s?.theme === 'light' ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.6)';
  ctx.fillText(s?.params?.title || s?.lyric?.slice(0,50) || '', 140, 1180);
  // Mini player
  ctx.fillStyle = 'rgba(28,28,30,.85)';
  roundRect(ctx, 40, H-190, W-80, 140, 40); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 32px -apple-system';
  ctx.fillText($('#mpTitle').textContent.slice(0,40), 180, H-115);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '500 26px -apple-system';
  ctx.fillText($('#mpArtist').textContent.slice(0,40), 180, H-80);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(180, H-70, W-360, 6);
  ctx.fillStyle = '#fff'; ctx.fillRect(180, H-70, (W-360)*Math.min(1,t/Math.max(dur,1)), 6);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = String(text || '').split(/\s+/);
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* Initial state */
genBtn.disabled = true;
</script>
