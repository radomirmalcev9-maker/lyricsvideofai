<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apple Motion Lyrics</title>
<style>
  :root{
    --bg:#07080b; --panel:#0f1117; --panel-2:#161922;
    --border-strong:#2a2f3f; --text:#f5f5f7; --muted:#8e8e93;
    --accent:#0a84ff; --green:#30d158; --red:#ff453a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  textarea,input,select{font-family:inherit;color:var(--text);}
  .app{display:grid;grid-template-columns:460px 1fr;height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{background:var(--panel);border-right:1px solid var(--border-strong);
           display:flex;flex-direction:column;min-width:0;}
  .sidebar header{padding:18px 20px 14px;border-bottom:1px solid var(--border-strong);}
  .sidebar h1{font-size:18px;font-weight:700;letter-spacing:-.02em;}
  .sidebar .sub{color:var(--muted);font-size:12px;margin-top:4px;}

  .drop{margin-top:14px;border:1.5px dashed #3a3f4d;border-radius:14px;padding:18px;
        text-align:center;cursor:pointer;transition:background .15s,border-color .15s;background:#11131a;}
  .drop:hover{background:#151925;border-color:var(--accent);}
  .drop.drag{border-color:var(--accent);background:#111a2b;}
  .drop .icon{font-size:24px;}
  .drop .hint{color:var(--muted);font-size:12px;margin-top:4px;}
  .drop input[type=file]{display:none;}
  .file-name{margin-top:8px;font-size:12px;color:var(--green);word-break:break-all;}

  label.lbl{display:block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.08em;
             color:var(--muted);text-transform:uppercase;}
  textarea#lyrics{margin-top:6px;width:100%;min-height:160px;resize:vertical;
                  background:#11131a;border:1px solid var(--border-strong);border-radius:10px;
                  padding:10px;font-size:13px;line-height:1.45;color:var(--text);}

  .row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .row select,.row button{background:#1a1e2a;border:1px solid var(--border-strong);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:12px;}
  .row select{flex:1;}
  .primary{background:var(--accent)!important;border-color:transparent!important;color:#fff;font-weight:600;}
  .primary[disabled]{opacity:.5;cursor:wait;}

  .status{margin-top:10px;font-size:12px;color:var(--muted);min-height:16px;}
  .status.ok{color:var(--green);}
  .status.err{color:var(--red);}

  .scenes-label{padding:14px 20px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;
                color:var(--muted);text-transform:uppercase;
                display:flex;justify-content:space-between;align-items:center;}
  .scenes{flex:1;overflow-y:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:8px;}
  .scene{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:12px;
         padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.15s;}
  .scene:hover{border-color:#3b4358;}
  .scene.active{border-color:var(--accent);background:#18203a;}
  .scene .num{font-size:11px;font-weight:700;color:var(--muted);min-width:28px;}
  .scene .body{flex:1;min-width:0;}
  .scene .t{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .scene .w{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
            background:#262c3b;font-size:10px;color:#9cb4ff;max-width:120px;overflow:hidden;
            white-space:nowrap;text-overflow:ellipsis;vertical-align:bottom;}
  .scene .l{margin-top:4px;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  /* ---------- Preview ---------- */
  .preview{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
           background:radial-gradient(1200px 600px at 50% 0%,#141827 0%,var(--bg) 60%);}
  .stage-frame{position:relative;}
  .stage-shell{width:360px;height:640px;border-radius:40px;background:#000;
    box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 2px #1c1c1e,0 0 0 10px #000;
    overflow:hidden;position:relative;}
  .stage{position:absolute;width:1080px;height:1920px;top:0;left:0;
    transform-origin:0 0;transform:scale(calc(360/1080));overflow:hidden;background:#0b0c10;}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:220px;height:58px;
         background:#000;border-radius:32px;z-index:20;}
  .statusbar{position:absolute;top:0;left:0;right:0;height:74px;z-index:15;
    display:flex;align-items:center;justify-content:space-between;padding:24px 56px 0;
    font-weight:600;font-size:28px;color:#fff;pointer-events:none;}
  .statusbar.light{color:#0b0c10;}
  .statusbar .right{display:flex;gap:12px;align-items:center;}
  .sb-bars{display:inline-flex;align-items:flex-end;gap:3px;height:20px;}
  .sb-bars span{width:4px;background:currentColor;border-radius:2px;}
  .sb-bars span:nth-child(1){height:35%}
  .sb-bars span:nth-child(2){height:55%}
  .sb-bars span:nth-child(3){height:75%}
  .sb-bars span:nth-child(4){height:100%}
  .sb-wifi{width:26px;height:20px;color:currentColor;}
  .sb-batt{width:42px;height:20px;border:2px solid currentColor;border-radius:6px;position:relative;padding:2px;}
  .sb-batt::after{content:"";position:absolute;right:-6px;top:5px;width:4px;height:8px;background:currentColor;border-radius:2px;}
  .sb-batt i{display:block;height:100%;width:85%;background:currentColor;border-radius:2px;}

  /* Background layer */
  .bg{position:absolute;inset:0;z-index:0;}
  .bg.rain{background:linear-gradient(180deg,#05070b 0%,#0b0f17 60%,#10141c 100%);}
  .bg.rain::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle at 50% 12%,rgba(255,255,255,.08),transparent 40%),
                     radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.12),transparent 60%);}
  .bg.light{background:linear-gradient(180deg,#f1f2f5 0%,#e3e5eb 100%);}
  .bg.solid{background:#0b0c10;}
  .bg.sunset{background:linear-gradient(180deg,#ff7043 0%,#ff5272 40%,#651fff 100%);}
  .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 40%,transparent 50%,rgba(0,0,0,.55) 100%);}

  /* Rain extras */
  .moon{position:absolute;top:240px;right:130px;width:180px;height:180px;border-radius:50%;
        background:radial-gradient(circle at 35% 35%,#f0f0ef,#a9a69e 70%,#6c6a62 100%);
        box-shadow:0 0 80px rgba(255,255,255,.2);opacity:.85;}
  .lamp{position:absolute;top:220px;left:50%;transform:translateX(-50%);width:420px;height:720px;pointer-events:none;}
  .lamp-shaft{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:520px;height:680px;
              background:radial-gradient(ellipse at 50% 0%,rgba(255,250,220,.35),rgba(255,250,220,0) 60%);filter:blur(2px);}
  .lamp-fixture{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:50px;border-radius:16px;
                background:linear-gradient(180deg,#d0d2d6,#7b7f88);}
  .lamp-pole{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:36px;height:670px;
             background:linear-gradient(180deg,#32353c 0%,#15171c 100%);}
  .ground{position:absolute;bottom:0;left:0;right:0;height:200px;
          background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#020305 80%);}
  .rain-drops{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .rain-drops i{position:absolute;top:-200px;width:2px;height:60px;
                background:linear-gradient(180deg,rgba(255,255,255,0),rgba(200,210,230,.55));
                animation:drop linear infinite;}
  @keyframes drop{0%{transform:translate3d(0,-120px,0);opacity:0}10%{opacity:1}100%{transform:translate3d(0,2200px,0);opacity:0}}

  /* Lyrics — per-word karaoke */
  .lyrics{position:absolute;top:260px;left:80px;right:80px;z-index:10;
          font-size:72px;font-weight:800;line-height:1.1;letter-spacing:-.03em;
          text-shadow:0 6px 30px rgba(0,0,0,.55);min-height:320px;}
  .lyrics .line{display:block;}
  .lyrics .word{display:inline-block;white-space:pre;
                transition:color .18s linear, transform .25s cubic-bezier(.22,1,.36,1),
                           text-shadow .25s ease, filter .25s ease;
                color:rgba(255,255,255,.2);
                padding:0 .02em;margin:0 .02em;border-radius:8px;
                will-change:transform,color,text-shadow;}
  .lyrics .word.said{color:#fff; text-shadow:0 2px 18px rgba(0,0,0,.35);}
  .lyrics .word.cur{color:#fff;
                    transform:translateY(-8px) scale(1.12);
                    text-shadow:0 0 22px var(--accent,#0a84ff),
                                0 0 6px var(--accent,#0a84ff),
                                0 6px 24px rgba(0,0,0,.6);
                    filter:drop-shadow(0 0 12px var(--accent,#0a84ff));}
  .lyrics.light .word{color:rgba(0,0,0,.25);}
  .lyrics.light .word.said{color:#0b0c10; text-shadow:0 2px 14px rgba(0,0,0,.12);}
  .lyrics.light .word.cur{color:#0b0c10;
                          text-shadow:0 0 22px var(--accent,#0a84ff),
                                      0 0 6px var(--accent,#0a84ff);
                          filter:drop-shadow(0 0 10px var(--accent,#0a84ff));}
  /* Smooth crossfade between scenes: outgoing scene fades out, incoming rises in */
  .widget-slot,.lyrics{transition:opacity .35s ease;}
  .widget-slot.swap-out,.lyrics.swap-out{opacity:0;}
  .widget-slot.swap-in,.lyrics.swap-in{opacity:1;}

  @keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

  /* Widget slot — pure HTML/CSS from the LLM gets injected here.
     We force injected cards to FILL the slot completely so the AI's
     820x520 card is never a small box floating inside a bigger glass area.
     3D perspective was removed: it triggers expensive layer re-paints on
     every word transition and was the #1 source of playback lag. */
  .widget-slot{position:absolute;top:900px;left:80px;right:80px;
               width:calc(100% - 160px);height:600px;
               z-index:8;contain:layout paint style;}
  /* Force the injected .w to stretch to the slot. Using !important to
     override whatever the LLM emits (fixed widths, margins, flex centering
     that would leave gaps). */
  .widget-slot .w{box-sizing:border-box !important;
                  width:100% !important;
                  min-height:600px !important;height:100% !important;
                  max-width:none !important;
                  margin:0 !important;
                  display:flex !important;flex-direction:column !important;
                  animation:rise .4s cubic-bezier(.22,1,.36,1) both;
                  will-change:transform,opacity;}
  .widget-slot.anim-rise  .w{animation:rise .45s cubic-bezier(.22,1,.36,1) both;}
  .widget-slot.anim-slide .w{animation:slide .45s cubic-bezier(.22,1,.36,1) both;}
  .widget-slot.anim-fade  .w{animation:fade .5s ease both;}
  .widget-slot.anim-pop   .w{animation:pop .45s cubic-bezier(.22,1,.36,1) both;}
  /* Anchor any absolute-positioned children to the card (not the viewport). */
  .widget-slot .w, .widget-slot{position:relative;}

  /* Mini player */
  .miniplayer{position:absolute;left:40px;right:40px;bottom:56px;height:140px;
              background:rgba(28,28,30,.85);border:1px solid rgba(255,255,255,.08);
              border-radius:40px;padding:20px 28px;z-index:12;
              -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);
              display:flex;align-items:center;gap:24px;color:#fff;}
  .miniplayer .art{width:100px;height:100px;border-radius:22px;flex-shrink:0;
                   background:linear-gradient(135deg,var(--accent,#0a84ff),#000);
                   display:flex;align-items:center;justify-content:center;font-size:40px;}
  .miniplayer .meta{flex:1;min-width:0;}
  .miniplayer .title{font-weight:700;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .miniplayer .artist{font-size:20px;color:rgba(255,255,255,.6);margin-top:4px;}
  .miniplayer .bar{margin-top:10px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}
  .miniplayer .bar i{display:block;height:100%;background:#fff;width:0;transition:width .1s linear;}
  .miniplayer .times{margin-top:6px;display:flex;justify-content:space-between;font-size:18px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;}
  .miniplayer .wave{display:inline-flex;gap:4px;align-items:flex-end;height:40px;}
  .miniplayer .wave span{width:6px;background:#fff;border-radius:3px;animation:wv 1s ease-in-out infinite;}
  .miniplayer .wave span:nth-child(1){height:30%;animation-delay:0s}
  .miniplayer .wave span:nth-child(2){height:70%;animation-delay:.2s}
  .miniplayer .wave span:nth-child(3){height:45%;animation-delay:.4s}
  .miniplayer .wave span:nth-child(4){height:90%;animation-delay:.6s}
  .miniplayer .wave span:nth-child(5){height:55%;animation-delay:.8s}
  @keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}

  /* Controls */
  .controls{margin-top:22px;display:flex;gap:10px;align-items:center;width:360px;}
  .controls audio{flex:1;}
  .controls button{padding:10px 14px;border-radius:10px;border:1px solid var(--border-strong);
                   background:#161922;color:#fff;font-weight:600;}
  .controls button:disabled{opacity:.5;cursor:not-allowed;}

  .export-progress{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;
                   display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:18px;}
  .export-progress.show{display:flex;}
  .spinner{width:44px;height:44px;border:4px solid #333;border-top-color:var(--accent);
           border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>Apple Motion Lyrics</h1>
      <div class="sub">MP3 + текст песни → 9:16 lyric-видео. Виджеты придумывает AI с нуля.</div>

      <label class="drop" id="drop">
        <div class="icon">🎵</div>
        <div id="dropText">Загрузить MP3</div>
        <div class="hint">или перетащи файл</div>
        <input id="file" type="file" accept="audio/*" />
      </label>
      <div class="file-name" id="fileName"></div>

      <label class="lbl">Текст песни (одна строка = одна сцена)</label>
      <textarea id="lyrics" placeholder="Вставь полный текст песни сюда. Каждая перенесённая строка станет отдельной сценой с своим виджетом."></textarea>

      <div class="row">
        <select id="modelSel" title="Модель LLM">
          <option value="fast">⚡ Быстрая (fast)</option>
          <option value="max" selected>🧠 Сильная (max)</option>
          <option value="claude-opus-4-6">Claude Opus 4</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4</option>
          <option value="gpt-5">GPT-5</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>
        <button id="genBtn" class="primary">Сгенерировать</button>
      </div>
      <div class="status" id="status">Готово.</div>
    </header>

    <div class="scenes-label"><span>Сцены</span><span id="sceneCount"></span></div>
    <div class="scenes" id="scenes"></div>
  </aside>

  <main class="preview">
    <div class="stage-frame">
      <div class="stage-shell">
        <div class="stage" id="stage">
          <div class="bg" id="bg"></div>
          <div class="moon" id="moon" style="display:none"></div>
          <div class="lamp" id="lamp" style="display:none">
            <div class="lamp-shaft"></div><div class="lamp-pole"></div><div class="lamp-fixture"></div>
          </div>
          <div class="ground" id="ground" style="display:none"></div>
          <div class="rain-drops" id="rain" style="display:none"></div>
          <div class="vignette"></div>

          <div class="statusbar" id="sbar">
            <div>3:14</div>
            <div class="right">
              <span class="sb-bars"><span></span><span></span><span></span><span></span></span>
              <svg class="sb-wifi" viewBox="0 0 24 18" fill="currentColor"><path d="M12 17a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm0-5a5 5 0 014 2l2-2a8 8 0 00-12 0l2 2a5 5 0 014-2zm0-5a10 10 0 017.5 3.5l2-2A13 13 0 002.5 8.5l2 2A10 10 0 0112 7z"/></svg>
              <span class="sb-batt"><i></i></span>
            </div>
          </div>
          <div class="notch"></div>

          <div class="lyrics" id="lyrics"></div>
          <div class="widget-slot" id="widgetSlot"></div>

          <div class="miniplayer" id="miniplayer" style="display:none">
            <div class="art" id="mpArt">🎵</div>
            <div class="meta">
              <div class="title" id="mpTitle">—</div>
              <div class="artist" id="mpArtist">—</div>
              <div class="bar"><i id="mpBar"></i></div>
              <div class="times"><span id="mpCur">0:00</span><span id="mpRem">-0:00</span></div>
            </div>
            <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <audio id="audio" controls style="flex:1"></audio>
      <button id="playBtn" class="ghost">▶</button>
      <button id="exportBtn" class="primary" disabled>⬇ MP4</button>
    </div>
  </main>
</div>

<div class="export-progress" id="exportProgress">
  <div class="spinner"></div>
  <div id="exportStatus">Рендерим MP4…</div>
</div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), bg = $('#bg'), moon = $('#moon'), lamp = $('#lamp'),
      ground = $('#ground'), rain = $('#rain'), sbar = $('#sbar'),
      lyricsEl = $('#lyrics'), widgetSlot = $('#widgetSlot'),
      miniplayer = $('#miniplayer'), audio = $('#audio'),
      scenesEl = $('#scenes'), statusEl = $('#status'), sceneCountEl = $('#sceneCount'),
      drop = $('#drop'), fileInput = $('#file'), fileNameEl = $('#fileName'),
      lyricsTa = $('#lyrics'), genBtn = $('#genBtn'), modelSel = $('#modelSel'),
      exportBtn = $('#exportBtn'), exportProgress = $('#exportProgress'),
      exportStatus = $('#exportStatus');

let currentScenes = [], activeIdx = -1, lastFile = null;

/* Build rain once */
(function buildRain(){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 80; i++){
    const d = document.createElement('i');
    d.style.left = Math.random()*100+'%';
    d.style.animationDuration = (.4+Math.random()*.7)+'s';
    d.style.animationDelay = (-Math.random()*1.5)+'s';
    d.style.opacity = .3+Math.random()*.7;
    d.style.height = (40+Math.random()*80)+'px';
    frag.appendChild(d);
  }
  rain.appendChild(frag);
})();

/* File input */
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files?.[0]; if (f) setFile(f); });
fileInput.addEventListener('change', e => { const f = e.target.files?.[0]; if (f) setFile(f); });
function setFile(f){ lastFile = f; fileNameEl.textContent = '✓ ' + f.name; genBtn.disabled = false; }

genBtn.addEventListener('click', generate);

async function generate(){
  if (!lastFile) { status('Загрузи MP3','err'); return; }
  const lyrics = lyricsTa.value.trim();
  if (!lyrics) { status('Вставь текст песни в поле','err'); return; }
  status('Отправка на сервер: транскрибация и рендер виджетов…');
  genBtn.disabled = true; exportBtn.disabled = true;
  const fd = new FormData();
  fd.append('file', lastFile);
  fd.append('lyrics', lyrics);
  fd.append('model_name', modelSel.value);
  fd.append('language', 'ru');
  try{
    const res = await fetch('/api/generate', {method:'POST', body: fd});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || JSON.stringify(data));
    currentScenes = data.scenes || [];
    audio.src = data.audio_url;
    miniplayer.style.display = 'flex';
    $('#mpTitle').textContent = lastFile.name.replace(/\.[^.]+$/,'');
    $('#mpArtist').textContent = (data.stub_mode ? '⚠ STUB · Lyrics Video' : 'Lyrics Video');
    renderScenesGrid();
    applyScene(0);
    const okMsg = 'Готово: '+currentScenes.length+' сцен · Whisper '+data.timings_ms.whisper+'ms · Arena '+data.timings_ms.arena+'ms';
    if (data.stub_mode && data.arena_status && data.arena_status !== 'ok') {
      status(okMsg+' · STUB: '+data.arena_status, 'err');
    } else if (data.stub_mode) {
      status(okMsg+' · STUB (Arena недоступна, виджеты-заглушки)', 'err');
    } else {
      status(okMsg, 'ok');
    }
    exportBtn.disabled = currentScenes.length === 0;
  }catch(e){
    status('Ошибка: '+e.message, 'err');
  }finally{
    genBtn.disabled = false;
  }
}
function status(msg, cls){ statusEl.className = 'status '+(cls||''); statusEl.textContent = msg; }

/* Scenes grid */
function renderScenesGrid(){
  scenesEl.innerHTML = '';
  sceneCountEl.textContent = currentScenes.length+' сцен';
  currentScenes.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'scene';
    d.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="body">
        <div class="t">${fmt(s.start)} – ${fmt(s.end)}<span class="w">${(s.widget_html||'').slice(0,50).replace(/[<>]/g,'')}…</span></div>
        <div class="l">${escapeHtml(s.line||'')}</div>
      </div>`;
    d.onclick = () => { audio.currentTime = s.start; audio.play(); };
    scenesEl.appendChild(d);
  });
}
function fmt(t){ if(t==null)return '0:00'; const m=Math.floor(t/60),s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Apply scene to stage */
function applyScene(idx){
  if (idx === activeIdx || idx<0 || idx>=currentScenes.length) return;
  activeIdx = idx;
  const s = currentScenes[idx];
  [...scenesEl.children].forEach((el,i) => el.classList.toggle('active', i===idx));
  const el = scenesEl.children[idx];
  if (el) el.scrollIntoView({block:'nearest', behavior:'smooth'});

  // Accent
  const accent = s.accent || '#0a84ff';
  stage.style.setProperty('--accent', accent);

  // Background
  const bgType = (s.background?.type || 'gradient');
  const colors = s.background?.colors || ['#0b0c10','#1c1c2b'];
  const isLight = s.theme === 'light' || bgType === 'light';
  bg.className = 'bg';
  bg.style.background = '';
  moon.style.display = 'none'; lamp.style.display = 'none'; ground.style.display = 'none'; rain.style.display = 'none';
  if (bgType === 'rain'){
    bg.classList.add('rain'); moon.style.display = lamp.style.display = ground.style.display = rain.style.display = 'block';
  } else if (bgType === 'light' || isLight){
    bg.classList.add('light');
  } else if (bgType === 'sunset'){
    bg.classList.add('sunset');
  } else {
    bg.classList.add('solid');
    bg.style.background = `linear-gradient(180deg, ${colors[0]} 0%, ${colors[1]||colors[0]} 100%)`;
  }
  sbar.classList.toggle('light', isLight);
  lyricsEl.classList.toggle('light', isLight);
  lyricsEl.style.color = ''; // word classes drive colors

  // Widget HTML (AI-generated)
  const anim = s.entrance || 'rise';
  widgetSlot.className = 'widget-slot anim-'+anim;
  widgetSlot.innerHTML = s.widget_html || '';

  // Lyrics: per-word karaoke spans
  lyricsEl.innerHTML = '';
  (s.words||[]).forEach(w => {
    const span = document.createElement('span');
    span.className = 'word';
    span.dataset.start = w.start; span.dataset.end = w.end;
    span.textContent = w.word;
    // preserve inter-word spacing (tokens originally separated by regex(\s+), so add a trailing space)
    lyricsEl.appendChild(span);
    lyricsEl.appendChild(document.createTextNode(' '));
  });
  lyricsEl.classList.remove('enter'); void lyricsEl.offsetWidth; lyricsEl.classList.add('enter');
}

/* Robust "which scene is at time t?" lookup.
 * Returns the index of the scene whose start is the LATEST one still <= t,
 * clamped to the last scene for overshoots. This never returns -1 once
 * there are scenes — so the user cannot see a skipped/frozen scene even
 * if a scene's [start,end) interval has a rounding gap on the server side.
 */
function findSceneAt(t){
  if (!currentScenes.length) return -1;
  let best = 0;
  for (let i=0;i<currentScenes.length;i++){
    if (currentScenes[i].start <= t + 0.001) best = i;
    else break; // scenes are sorted by start
  }
  return best;
}

/* Playback sync.
 * Performance notes:
 *   - We use requestAnimationFrame instead of 'timeupdate' (which only fires
 *     ~4/sec and makes karaoke feel laggy). RAF ticks with the display
 *     refresh (~60/s), driven by audio.currentTime as the source of truth.
 *   - wordEls is cached per scene — no querySelectorAll on every frame.
 *   - Word state is incremental: we only mutate words whose state actually
 *     changed relative to the last frame, avoiding layout thrash from
 *     adding/removing the same classes each tick.
 */
let _rafId = null, _cachedWordEls = null, _curWordIdx = -1;
function tickPlayback(){
  if (!currentScenes.length){ _rafId = requestAnimationFrame(tickPlayback); return; }
  const t = audio.currentTime;
  const idx = findSceneAt(t);
  if (idx !== -1 && idx !== activeIdx){
    applyScene(idx);
    _cachedWordEls = lyricsEl.querySelectorAll('.word');
    _curWordIdx = -1;
  }
  const s = currentScenes[idx];
  if (s && s.words && _cachedWordEls){
    const words = s.words;
    // Find current word via forward scan from previous position (cheap).
    let newCur = -1;
    for (let i=Math.max(0,_curWordIdx); i<words.length; i++){
      if (t >= words[i].start && t < words[i].end){ newCur = i; break; }
      if (words[i].end <= t && i < words.length-1 && t < words[i+1].start){ newCur = i; break; }
      if (i === words.length-1 && t >= words[i].start){ newCur = i; break; }
    }
    if (newCur !== _curWordIdx){
      // Undo previous 'cur'
      if (_curWordIdx >= 0 && _cachedWordEls[_curWordIdx]){
        _cachedWordEls[_curWordIdx].classList.remove('cur');
      }
      // Mark all words up to newCur as 'said', the rest as not, and flag newCur as 'cur'
      for (let i=0;i<words.length;i++){
        const el = _cachedWordEls[i]; if (!el) continue;
        const wasSaid = el.classList.contains('said');
        const wasCur  = el.classList.contains('cur');
        const isSaid  = (i <= newCur) || t >= words[i].end;
        const isCur   = (i === newCur);
        if (isSaid !== wasSaid){ el.classList.toggle('said', isSaid); }
        if (isCur  !== wasCur) { el.classList.toggle('cur',  isCur); }
      }
      _curWordIdx = newCur;
    }
  }
  // Mini player (lightweight DOM updates)
  if (audio.duration){
    $('#mpBar').style.width = (t/audio.duration*100)+'%';
    $('#mpCur').textContent = fmt(t);
    $('#mpRem').textContent = '-'+fmt(Math.max(0,audio.duration-t));
  }
  _rafId = requestAnimationFrame(tickPlayback);
}
_rafId = requestAnimationFrame(tickPlayback);
audio.addEventListener('pause', () => { if(_rafId){ cancelAnimationFrame(_rafId); _rafId=null; } });
audio.addEventListener('play',  () => { if(!_rafId) _rafId = requestAnimationFrame(tickPlayback); });
audio.addEventListener('play', () => { $('#playBtn').textContent = '❚❚'; });
audio.addEventListener('pause', () => { $('#playBtn').textContent = '▶'; });
$('#playBtn').addEventListener('click', () => { if (audio.paused) audio.play(); else audio.pause(); });
// Keyboard shortcuts: Space=play/pause, Arrows=±5s, J/L=±10s, K=play/pause, 0/Home=restart.
document.addEventListener('keydown', (e)=>{
  if (!currentScenes.length) return;
  if (e.target && (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  if (e.code==='Space' || e.key==='k' || e.key==='K'){ e.preventDefault(); if(audio.paused)audio.play(); else audio.pause(); return; }
  if (e.key==='ArrowLeft'){ e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime-5); return; }
  if (e.key==='ArrowRight'){ e.preventDefault(); audio.currentTime = Math.min(audio.duration||Infinity, audio.currentTime+5); return; }
  if (e.key==='j'||e.key==='J'){ audio.currentTime = Math.max(0, audio.currentTime-10); return; }
  if (e.key==='l'||e.key==='L'){ audio.currentTime = Math.min(audio.duration||Infinity, audio.currentTime+10); return; }
  if (e.key==='Home' || e.key==='0'){ audio.currentTime = 0; return; }
});
// When the user seeks (scrubber, arrow keys, clicking a scene), reset cached
// karaoke state so words re-light correctly from the new position.
audio.addEventListener('seeked', () => {
  _lastActiveIdx = -1;
  _curWordIdx = -1;
  _cachedWordEls = currentScenes.length ? lyricsEl.querySelectorAll('.word') : null;
  const idx = findSceneAt(audio.currentTime);
  if (idx !== -1) applyScene(idx);
});

/* ---- Minimal MP4 export via canvas (real widgets rasterized via SVG foreignObject) ---- */
exportBtn.addEventListener('click', startExport);

// Logical (design) size of the export canvas — 1080x1920 (9:16). The canvas
// itself is allocated at _EXPORT_DPR× this for Retina-sharp output.
const LOGICAL_W = 1080, LOGICAL_H = 1920;

// Rasterize a self-contained HTML+CSS snippet into an HTMLImageElement that
// can be drawn onto a canvas. Uses the classic SVG <foreignObject> trick
// (inline everything; no external resources) so that widgets generated by
// the LLM render visually the same way they do in the live preview.
// Canvas export caveat: Chromium blocks some CSS features (most notably
// backdrop-filter) inside foreignObject images, so we draw the glass
// backdrop at the canvas level instead. Widgets that use inline
// <style>@keyframes won't animate during export — they'll be painted at
// their resting state, which is acceptable since the entrance animation
// is applied at the canvas level.
const _WIDGET_DPR = 2; // Retina: render widgets at 2x so they look crisp in the export.
const _WIDGET_IMG_CACHE = new Map(); // scene_id -> HTMLImageElement (loaded)
function rasterizeWidget(widgetHtml, theme) {
  // Logical size of the widget card area (matches live CSS slot):
  const LW = 920, LH = 600;
  // Physical pixel size we rasterize at:
  const W = LW * _WIDGET_DPR, H = LH * _WIDGET_DPR;
  const txtColor = theme==='light'?'#0b0c10':'#fff';
  // Tell the inner content to lay itself out at 2x (like a Retina screen),
  // then scale down visually so shapes/text stay sharp.
  // IMPORTANT: mirror the live-preview CSS that forces .w to fill the slot
  // — without this, widgets rasterize at their intrinsic 820x520 and look
  // small in the middle of the glass card.
  const baseCss = `
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;width:${W}px;height:${H}px;
         font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased;
         -moz-osx-font-smoothing:grayscale;
         text-rendering:optimizeLegibility;
         color:${txtColor};background:transparent;overflow:hidden;
         display:flex;align-items:stretch;justify-content:stretch;}
    .w{box-sizing:border-box;
       width:100% !important;min-height:100% !important;height:100% !important;
       max-width:none !important;margin:0 !important;
       display:flex !important;flex-direction:column !important;
       transform-origin:center center;}
  `;
  // foreignObject needs an explicit size in SVG CSS pixels; we let the SVG
  // itself be at logical size and scale its contents via viewBox.
  const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${LW}" height="${LH}" viewBox="0 0 ${W} ${H}">`
    +   `<foreignObject x="0" y="0" width="${W}" height="${H}">`
    +     `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px;">`
    +       `<style>${baseCss}</style>`
    +       (widgetHtml || '')
    +     `</div>`
    +   `</foreignObject>`
    + `</svg>`;
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = ()=>{
      // Tag with intended draw size so consumers don't have to guess.
      img._lw = LW; img._lh = LH;
      resolve(img);
    };
    img.onerror = (e)=>{ console.warn('widget rasterize failed', e); resolve(null); };
    img.src = dataUrl;
  });
}

async function prerenderWidgetImages(scenes){
  _WIDGET_IMG_CACHE.clear();
  const total = scenes.length;
  for (let i=0;i<total;i++){
    const s = scenes[i];
    exportStatus.textContent = 'Подготовка виджетов: '+(i+1)+'/'+total+'…';
    // Yield to UI so progress paints.
    await new Promise(r=>setTimeout(r,0));
    const img = await rasterizeWidget(s.widget_html||'', s.theme||'dark');
    _WIDGET_IMG_CACHE.set(s.scene_id, img);
  }
}

async function startExport(){
  if (!currentScenes.length) return;
  exportBtn.disabled = true; exportProgress.classList.add('show');
  exportStatus.textContent = 'Подготовка рендера 1080×1920…';

  // 1. Rasterize all widgets up-front (one SVG/Image per scene).
  await prerenderWidgetImages(currentScenes);

  // 2. Set up canvas + MediaRecorder (Retina canvas for sharper output).
  const _EXPORT_DPR = Math.min(window.devicePixelRatio || 2, 2);
  const canvas = document.createElement('canvas');
  canvas.width  = LOGICAL_W * _EXPORT_DPR;
  canvas.height = LOGICAL_H * _EXPORT_DPR;
  canvas.style.width  = LOGICAL_W+'px';
  canvas.style.height = LOGICAL_H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(_EXPORT_DPR, _EXPORT_DPR);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const vidStream = canvas.captureStream(60);
  let mediaSrc = null;
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    const ac = new AC();
    const resp = await fetch(audio.src); const arr = await resp.arrayBuffer();
    const buf = await ac.decodeAudioData(arr);
    const src = ac.createBufferSource(); src.buffer = buf;
    const dest = ac.createMediaStreamDestination();
    src.connect(dest); src.connect(ac.destination);
    mediaSrc = {ac, src};
    if (dest.stream.getAudioTracks().length) vidStream.addTrack(dest.stream.getAudioTracks()[0]);
    src.start();
  }catch(e){ console.warn('audio export fallback', e); }
  const mime = ['video/mp4;codecs=h264,aac','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const chunks = [];
  // Cinematic-quality bitrate for Retina (2x) frames so fine widget detail,
  // text and glow survive compression. 24 Mbps at 30fps is roughly broadcast
  // social-media quality; still produces reasonable file sizes for a 3-4 min track.
  const rec = new MediaRecorder(vidStream, mime?{mimeType:mime,videoBitsPerSecond:24_000_000}:undefined);
  rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  const done = new Promise(res=>rec.onstop=res);
  audio.pause(); audio.currentTime = 0; applyScene(0); activeIdx=-1;
  // Pause the live preview RAF loop during export — it's not needed and
  // doubles the work.
  if (_rafId){ cancelAnimationFrame(_rafId); _rafId = null; }
  rec.start();
  exportStatus.textContent='Рендер… 0%';
  const dur = audio.duration || (currentScenes[currentScenes.length-1]?.end ?? 0);
  const t0 = performance.now();
  let stopped = false;
  let lastPaint = 0;
  const FRAME_MS = 1000/30; // 30fps export is enough for lyrics and halves CPU
  function paint(now){
    const t = (now-t0)/1000;
    if (t >= dur){ if(!stopped){stopped=true;rec.stop(); if(mediaSrc)try{mediaSrc.src.stop();}catch(e){}} return; }
    const idx = findSceneAt(t);
    if (idx!==-1 && idx!==activeIdx) applyScene(idx);
    if (now - lastPaint >= FRAME_MS || lastPaint === 0){
      drawSceneToCanvas(ctx, currentScenes[idx], t, dur, accentFor(currentScenes[idx]),
                        _WIDGET_IMG_CACHE.get(currentScenes[idx]?.scene_id) || null);
      lastPaint = now;
    }
    exportStatus.textContent = 'Рендер… '+Math.round(t/dur*100)+'%';
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);
  await done;
  const blob = new Blob(chunks,{type:rec.mimeType||'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ext = (rec.mimeType||'webm').includes('mp4')?'mp4':'webm';
  a.href=url; a.download=`lyrics_${Date.now()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  _WIDGET_IMG_CACHE.clear();
  exportProgress.classList.remove('show'); exportBtn.disabled=false;
  // Resume the live playback RAF loop.
  if (!_rafId) _rafId = requestAnimationFrame(tickPlayback);
}
function accentFor(s){return s?.accent||'#0a84ff';}

// Entrance easing for the widget card (matches the live CSS 'rise' animation).
function _entranceAlpha(progress){
  // progress 0..1 over first 450ms of a scene.
  const p = Math.max(0, Math.min(1, progress));
  return p; // linear fade is fine for export; the scale is the main tell.
}
function _entranceScale(progress){
  const p = Math.max(0, Math.min(1, progress));
  // ease-out cubic, 0.86 -> 1.0
  const t = 1 - Math.pow(1-p, 3);
  return 0.86 + 0.14*t;
}

function drawSceneToCanvas(ctx,s,t,dur,accent,widgetImg){
  const W=LOGICAL_W,H=LOGICAL_H;
  // -- Background (gradient + type-specific overlays)
  const colors=s?.background?.colors||['#0b0c10','#1c1c2b'];
  const bgType = s?.background?.type || 'gradient';
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,colors[0]); g.addColorStop(1,colors[1]||colors[0]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Sunset: soft sun orb + warm radial wash
  if (bgType==='sunset'){
    const sun = ctx.createRadialGradient(W*0.5, H*0.55, 20, W*0.5, H*0.55, 900);
    sun.addColorStop(0,'rgba(255,180,80,.55)');
    sun.addColorStop(0.35,'rgba(255,100,120,.25)');
    sun.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  }
  // Rain: diagonal streaks
  if (bgType==='rain'){
    ctx.save();
    ctx.strokeStyle='rgba(180,210,255,.35)';
    ctx.lineWidth=1.5;
    const seedShift = (t*380) % 60;
    for (let i=0;i<90;i++){
      const rx = ((i*137 + seedShift) % (W+200)) - 100;
      const ry = ((i*211 + seedShift*2) % (H+200)) - 100;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx-18, ry+52);
      ctx.stroke();
    }
    ctx.restore();
  }
  // Light: subtle sunburst top-right
  if (bgType==='light'){
    const burst = ctx.createRadialGradient(W*0.85, 120, 10, W*0.85, 120, 900);
    burst.addColorStop(0,'rgba(255,255,255,.5)');
    burst.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
  }

  // Global vignette (slightly stronger for darker themes)
  const vg=ctx.createRadialGradient(W/2,H*.45,200,W/2,H*.45,1200);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1, s?.theme==='light'?'rgba(0,0,0,.25)':'rgba(0,0,0,.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // -- Status bar (live clock + signal/wifi/battery drawn with shapes)
  ctx.fillStyle=s?.theme==='light'?'#0b0c10':'#fff';
  ctx.font='600 38px -apple-system, "SF Pro Display", sans-serif';
  ctx.textBaseline='middle';
  const now = new Date();
  const hh = now.getHours().toString().padStart(2,'0');
  const mm = now.getMinutes().toString().padStart(2,'0');
  ctx.fillText(hh+':'+mm, 74, 58);
  // Right side icons (drawn as shapes; emoji render inconsistently on canvas)
  ctx.save();
  const sx = W - 240;
  // 4 signal bars
  for (let i=0;i<4;i++){ const bh=6+i*5; ctx.fillRect(sx+i*10, 78-bh, 6, bh); }
  // Wi-Fi wedge arc
  ctx.beginPath(); ctx.arc(sx+66,86,16,Math.PI*1.15,Math.PI*1.85); ctx.lineWidth=4; ctx.strokeStyle=ctx.fillStyle; ctx.stroke();
  // Battery outline + tip + level
  ctx.lineWidth=3; roundRect(ctx,sx+100,60,46,22,5); ctx.stroke();
  ctx.fillRect(sx+148,67,4,8);
  ctx.fillRect(sx+104,64,34,14);
  ctx.restore();
  ctx.textBaseline='alphabetic';

  // Dynamic Island (black pill) with a subtle pulsing mic/cam dot during scenes
  ctx.fillStyle='#000'; roundRect(ctx,W/2-150,20,300,70,35); ctx.fill();
  // Tiny green camera dot on the right side of the island
  const dotA = 0.6 + 0.4*Math.sin(t*3.5);
  ctx.save();
  ctx.globalAlpha = dotA;
  ctx.fillStyle = '#30d158';
  ctx.beginPath(); ctx.arc(W/2+112,55,6,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='#30d158'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(W/2+112,55,4,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // -- Karaoke text (word-by-word karaoke highlighting)
  if (s && s.words){
    ctx.textBaseline='alphabetic';
    ctx.font='800 72px -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif';
    let x=80,y=380;
    const lineH=96;
    s.words.forEach(w=>{
      const isDone = t>=w.end, isCur = t>=w.start && t<w.end;
      let fill;
      if (s.theme==='light'){
        fill = isCur?accent:isDone?'#0b0c10':'rgba(0,0,0,.28)';
      }else{
        fill = isCur?accent:isDone?'#fff':'rgba(255,255,255,.28)';
      }
      let yy = y;
      let scale = 1.0;
      let glow = 0;
      if (isCur){
        const wd = Math.max(0.001, w.end - w.start);
        const localT = Math.max(0, Math.min(1, (t - w.start)/wd));
        const k = Math.sin(localT*Math.PI);
        yy -= k*8;
        scale = 1 + k*0.06;
        glow = k;
      }
      const text = w.word;
      const spaceW = ctx.measureText(' ').width;
      ctx.font='800 72px -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif';
      const ww = ctx.measureText(text).width + spaceW;
      if (x+ww > W-80){ x=80; y+=lineH; yy=y; }

      const drawWord = (color, shadow) => {
        ctx.save();
        ctx.fillStyle = color;
        if (shadow) { ctx.shadowColor = accent; ctx.shadowBlur = 24*glow; }
        if (scale!==1){ ctx.translate(x+ww/2-spaceW/2, yy); ctx.scale(scale,scale); ctx.fillText(text, -(ww-spaceW)/2, 0); }
        else          { ctx.fillText(text, x, yy); }
        ctx.restore();
      };

      if (isCur && glow>0){
        // 1) glow halo in accent color
        drawWord(accent, true);
        // 2) bright crisp word on top
        drawWord(s.theme==='light' ? '#0b0c10' : '#fff', false);
      }else{
        drawWord(fill, false);
      }
      x += ww;
    });
  }

  // -- Widget area (real rasterized HTML, not a placeholder!)
  const widgetX = 80, widgetY = 900, widgetW = W-160, widgetH = 600;
  // Glass card backdrop (simulates backdrop-filter blur since foreignObject
  // can't do live blur in <img>, but this looks identical behind the content)
  ctx.save();
  // Entrance animation: ease-out scale + fade over the first 450ms of the scene.
  const sceneStart = s?.start ?? 0;
  const entranceDur = 0.45;
  const eProg = Math.max(0, Math.min(1, (t - sceneStart)/entranceDur));
  const eAlpha = _entranceAlpha(eProg);
  const eScale = _entranceScale(eProg);
  ctx.globalAlpha = eAlpha;
  if (eScale !== 1){
    ctx.translate(widgetX+widgetW/2, widgetY+widgetH/2);
    ctx.scale(eScale, eScale);
    ctx.translate(-(widgetX+widgetW/2), -(widgetY+widgetH/2));
  }
  // Soft shadow
  ctx.shadowColor = 'rgba(0,0,0,.45)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = s?.theme==='light' ? 'rgba(255,255,255,.68)' : 'rgba(44,44,48,.78)';
  roundRect(ctx, widgetX, widgetY, widgetW, widgetH, 60); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = s?.theme==='light' ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.14)';
  ctx.lineWidth = 2; ctx.stroke();
  // Inner highlight (glass edge)
  const hlGrad = ctx.createLinearGradient(widgetX, widgetY, widgetX, widgetY+widgetH);
  hlGrad.addColorStop(0, s?.theme==='light'?'rgba(255,255,255,.55)':'rgba(255,255,255,.18)');
  hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hlGrad;
  roundRect(ctx, widgetX+2, widgetY+2, widgetW-4, widgetH/2, 58); ctx.fill();

  // Draw the actual widget HTML image on top, clipped to the card shape.
  if (widgetImg){
    ctx.save();
    roundRect(ctx, widgetX, widgetY, widgetW, widgetH, 60); ctx.clip();
    // Rasterized image is at _WIDGET_DPR; logical size in _lw/_lh.
    // Fill the ENTIRE card slot (COVER-style) so the widget doesn't sit as a
    // small centered box. This mirrors what the CSS !important rules do in
    // the live preview slot.
    const lw = widgetImg._lw || widgetW;
    const lh = widgetImg._lh || widgetH;
    const scale = Math.max(widgetW/lw, widgetH/lh);
    const dw = lw*scale, dh = lh*scale;
    const dx = widgetX + (widgetW - dw)/2;
    const dy = widgetY + (widgetH - dh)/2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(widgetImg, dx, dy, dw, dh);
    ctx.restore();
  }else{
    // Fallback label if rasterization failed for some reason.
    ctx.fillStyle = s?.theme==='light'?'#0b0c10':'#fff';
    ctx.font='700 44px -apple-system, sans-serif';
    ctx.fillText('…', widgetX+60, widgetY+120);
  }
  ctx.restore();

  // -- Mini player
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
  ctx.fillStyle=s?.theme==='light'?'rgba(255,255,255,.78)':'rgba(28,28,30,.85)';
  roundRect(ctx,40,H-190,W-80,140,40); ctx.fill();
  ctx.restore();
  ctx.fillStyle=s?.theme==='light'?'#0b0c10':'#fff';
  ctx.font='700 32px -apple-system, sans-serif'; ctx.fillText(($('#mpTitle')?.textContent||'Lyrics').slice(0,40),180,H-115);
  ctx.fillStyle=s?.theme==='light'?'rgba(0,0,0,.55)':'rgba(255,255,255,.55)';
  ctx.font='500 26px -apple-system, sans-serif'; ctx.fillText(($('#mpArtist')?.textContent||'').slice(0,40),180,H-80);
  ctx.fillStyle='rgba(120,120,128,.36)'; ctx.fillRect(180,H-70,W-360,6);
  ctx.fillStyle=accent; ctx.fillRect(180,H-70,(W-360)*Math.min(1,t/Math.max(dur,1)),6);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
</script>
